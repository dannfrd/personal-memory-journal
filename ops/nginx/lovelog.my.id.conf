# ==============================================================================
# Nginx Configuration for lovelog.my.id
# Target Hardware: VPS 2 vCPU, 4 GB RAM, 33 GB Storage
# Specs Covered: VPS-03, VPS-04, VPS-05, IMG-06, CDN-01, CDN-02, CDN-03, CDN-05
# ==============================================================================

# 1. Worker & Connection Tuning (Place in /etc/nginx/nginx.conf if needed)
# worker_processes auto; # 2 workers for 2 vCPU
# worker_rlimit_nofile 8192;
# events {
#     worker_connections 2048;
#     multi_accept on;
#     use epoll;
# }

# Upstream definitions with HTTP Keepalive pooling to reduce local TCP overhead
upstream lovelog_nextjs {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream lovelog_vps_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name lovelog.my.id www.lovelog.my.id;

    return 301 https://lovelog.my.id$request_uri;
}

# HTTPS & HTTP/2 Server Block (VPS-05)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lovelog.my.id www.lovelog.my.id;

    # SSL Certificates (Managed by Certbot / Cloudflare Origin CA)
    ssl_certificate /etc/letsencrypt/live/lovelog.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lovelog.my.id/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Upload Limit (Matches Backend 25 MB limit)
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Sendfile & TCP Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip Compression (VPS-04 / BE-07)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # Optional Brotli Compression (uncomment if libnginx-mod-http-brotli is installed)
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css application/json application/javascript application/xml image/svg+xml font/woff2;

    # ─── 1. Direct Static Serving for Uploaded Media (IMG-06, CDN-03) ────────
    # Directly serve /uploads/* from disk via Nginx sendfile (bypasses Node.js memory)
    location /uploads/ {
        alias /var/www/personal-memory-journal/public/uploads/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri @vps_api_uploads;
    }

    location @vps_api_uploads {
        proxy_pass http://lovelog_vps_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ─── 2. Next.js Immutable Static Bundles (CDN-02, CDN-03) ────────────────
    location /_next/static/ {
        proxy_pass http://lovelog_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ─── 3. Next.js Optimized Images (IMG-01, IMG-02, CDN-03) ────────────────
    location /_next/image {
        proxy_pass http://lovelog_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    }

    # ─── 4. Audio & Public Static Assets (IMG-05, IMG-06, CDN-03) ────────────
    location /audio/ {
        proxy_pass http://lovelog_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ─── 5. Private Admin & API Routes — Never Cache (CDN-05) ────────────────
    location ~ ^/(admin|api)/ {
        proxy_pass http://lovelog_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
    }

    # ─── 6. Main Next.js App Routes ──────────────────────────────────────────
    location / {
        proxy_pass http://lovelog_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
