name: Deploy Lovelog to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH & Deploy to VPS (Direct IPv6 / IPv4)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          APP_DIR: ${{ secrets.VPS_APP_DIR || '/var/www/personal-memory-journal' }}
        run: |
          if [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_HOST" ]; then
            echo "::error::GitHub Secrets VPS_HOST and VPS_SSH_KEY must be configured in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          cat <<EOF > ~/.ssh/config
          Host lovelog-vps
            HostName ${VPS_HOST}
            User ${VPS_USER}
            Port ${VPS_PORT}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF
          chmod 600 ~/.ssh/config

          echo "Connecting to ${VPS_USER}@${VPS_HOST}:${VPS_PORT}..."
          ssh lovelog-vps "cd ${APP_DIR} && git fetch origin main && git reset --hard origin/main && sed -i 's/\r$//' ops/scripts/deploy.sh && chmod +x ops/scripts/deploy.sh && ./ops/scripts/deploy.sh"
