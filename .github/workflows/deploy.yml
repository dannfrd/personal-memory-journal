name: Lovelog CI & Auto-Deploy Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Build, TypeScript & Backend Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Backend & Ops Scripts Syntax
        run: |
          node --check server/vps-api.cjs
          node --check ops/pm2/ecosystem.config.cjs
          node --check ops/testing/benchmark-api.mjs

      - name: Generate Prisma Client & Run TypeScript Check
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/journal?schema=public"
        run: |
          npx prisma generate
          npx tsc --noEmit
